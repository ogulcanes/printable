<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--seo-->
    <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://makerworld.bblmw.com">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <!--header-->

    <main class="checkout">
      <section class="container">
        <h1 class="checkout-title">Ödeme</h1>
        <ol class="checkout-steps" id="checkout-steps">
          <li data-step="1" class="active"><span>1</span>Sepet</li>
          <li data-step="2"><span>2</span>Teslimat</li>
          <li data-step="3"><span>3</span>Ödeme</li>
        </ol>

        <div class="checkout-grid">
          <div class="checkout-main">
            <!-- Step 1: Cart -->
            <section class="checkout-panel active" data-step="1">
              <h2>Sepetiniz</h2>
              <div id="cart-notice" class="cart-notice" hidden></div>
              <div id="checkout-cart" class="checkout-cart"></div>
              <p id="cart-error" class="checkout-error" hidden></p>
            </section>

            <!-- Step 2: Delivery -->
            <section class="checkout-panel" data-step="2">
              <h2>Teslimat bilgileri</h2>
              <form id="delivery-form" class="checkout-form">
                <label>Ad soyad *<input name="name" required autocomplete="name"></label>
                <div class="checkout-form__row">
                  <label>Telefon *<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx"></label>
                  <label>E-posta *<input name="email" type="email" required autocomplete="email"></label>
                </div>
                <div class="checkout-form__row">
                  <label>İl *<input name="city" required autocomplete="address-level1" placeholder="İstanbul"></label>
                  <label>İlçe *<input name="district" required autocomplete="address-level2" placeholder="Kadıköy"></label>
                </div>
                <div class="checkout-form__row">
                  <label>Mahalle<input name="neighborhood" autocomplete="address-level3"></label>
                  <label>Posta kodu<input name="postal_code" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="34000"></label>
                </div>
                <label>Açık adres *<textarea name="address" rows="3" required autocomplete="street-address" placeholder="Cadde, sokak, bina no, daire"></textarea></label>

                <fieldset class="checkout-invoice">
                  <legend>Fatura bilgileri</legend>
                  <label class="checkout-check">
                    <input type="checkbox" name="corporate_invoice">
                    <span><strong>Kurumsal fatura istiyorum</strong><small>Şirket/unvan, vergi dairesi ve VKN/TCKN bilgilerini ekleyin.</small></span>
                  </label>
                  <div class="checkout-invoice__fields" id="corporate-invoice-fields" hidden>
                    <label>Şirket / unvan *<input name="company_name" autocomplete="organization" maxlength="160"></label>
                    <div class="checkout-form__row">
                      <label>Vergi dairesi *<input name="tax_office" maxlength="100"></label>
                      <label>VKN / T.C. kimlik no *<input name="tax_number" inputmode="numeric" maxlength="11" autocomplete="off"></label>
                    </div>
                  </div>
                  <label class="checkout-check">
                    <input type="checkbox" name="different_billing_address">
                    <span><strong>Fatura adresim farklı</strong><small>İşaretlemezseniz teslimat adresi fatura adresi olarak kullanılır.</small></span>
                  </label>
                  <label id="billing-address-field" hidden>Fatura adresi *<textarea name="billing_address" rows="3" maxlength="400" autocomplete="billing street-address" placeholder="Mahalle, cadde, sokak, bina no, ilçe/il"></textarea></label>
                </fieldset>
                <p class="checkout-error" id="delivery-error" hidden></p>
              </form>
            </section>

            <!-- Step 3: Payment -->
            <section class="checkout-panel" data-step="3">
              <h2>Ödeme yöntemi</h2>
              <div class="payment-methods" role="radiogroup" aria-label="Ödeme yöntemi">
                <label class="payment-opt"><input type="radio" name="payment_method" value="kart" checked> <span><strong>Kredi / banka kartı</strong><small>PayTR güvenli ödeme ekranı</small></span></label>
              </div>
              <p class="checkout-error" id="payment-error" hidden></p>
              <div id="checkout-result" class="checkout-result" hidden></div>
            </section>

            <div class="checkout-nav">
              <button type="button" id="co-prev" class="ghost" hidden>Geri</button>
              <button type="button" id="co-next">Devam</button>
              <button type="button" id="co-submit" hidden>Güvenli ödemeye geç</button>
            </div>
          </div>

          <aside class="checkout-summary" aria-label="Sipariş özeti">
            <h2>Sipariş özeti</h2>
            <div id="summary-items" class="summary-items"></div>
            <div class="coupon-box">
              <label for="coupon-code">Kampanya kodu</label>
              <div class="coupon-box__row">
                <input id="coupon-code" name="coupon_code" placeholder="Kodunuz varsa girin" autocomplete="off">
                <button type="button" id="coupon-apply">Uygula</button>
              </div>
              <p class="coupon-box__msg" id="coupon-message" role="status" hidden></p>
            </div>

            <div class="summary-line"><span>Ürünler toplamı</span><strong id="summary-subtotal">0.00 TL</strong></div>
            <div id="summary-campaigns" class="summary-campaigns"></div>
            <div class="summary-line summary-line--muted"><span>Kargo</span><span class="summary-shipping">Alıcı ödemeli</span></div>
            <div class="summary-line summary-line--muted"><span id="summary-tax-label">KDV (%20, fiyata dâhil)</span><span id="summary-tax">0.00 TL</span></div>
            <div class="summary-line summary-total"><span>Genel toplam</span><strong id="summary-total">0.00 TL</strong></div>
            <p class="summary-note" id="summary-shipping-note">599 TL ve üzeri siparişlerde kargo ücretsizdir.</p>
            <a class="summary-back" href="/urunler">← Alışverişe devam et</a>
          </aside>
        </div>
      </section>
    </main>

    <!--cart-->

    <!--footer-->

    <!--chat-->
    <script src="/script.js"></script>
    <script src="https://www.paytr.com/js/iframeResizer.min.js"></script>
    <script src="/odeme.js"></script>
  </body>
</html>
