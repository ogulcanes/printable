<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--seo-->
    <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <!--header-->

    <main>
      <section class="container page-hero">
        <p class="section-kicker">Toptan Anahtarlık Kataloğu</p>
        <h1>3D Baskılı Anahtarlık Koleksiyonu</h1>
        <p class="page-lead">47 model tek sayfada. İstediklerinizi seçip listeyi Excel dosyası olarak indirebilirsiniz.</p>
      </section>

      <section class="container keychain-toolbar-wrap">
        <div class="keychain-toolbar">
          <label class="keychain-select-all">
            <input type="checkbox" id="keychain-select-all">
            Tümünü seç
          </label>
          <span class="keychain-count"><strong id="keychain-count-selected">0</strong> / <span id="keychain-count-total">47</span> seçili</span>
          <button type="button" class="btn-solid keychain-export" id="keychain-export">Excel'e Aktar</button>
        </div>
        <span class="keychain-export-hint" id="keychain-export-hint" role="status" aria-live="polite"></span>
      </section>

      <section class="container">
        <div class="keychain-grid" id="keychain-grid"></div>
      </section>
    </main>

    <!--cart-->
    <!--footer-->

    <!--chat-->
    <script src="/script.js"></script>
    <script src="/anahtarlik-katalog.js"></script>
  </body>
</html>
